apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: app-routing
  namespace: apps
spec:
  hosts:
  - "*"
  gateways:
  - istio-system/public-gateway
  http:
  
  - match:
    - uri:
        prefix: /bookings
    route:
    - destination:
        host: bookings.apps.svc.cluster.local
        port:
          number: 8080
