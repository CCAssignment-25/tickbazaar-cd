replicaCount: 2

image:
  repository: asia-south1-docker.pkg.dev/focused-zephyr-478716-n0/cc-assignment/s-cart
  tag: "v1"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

hpa:
  enabled: true
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

istio:
  enabled: true
  prefix: /bookings
  gateway: istio-system/public-gateway
